# ---------------------------------------------------------------------------
# Security headers.
#
# Cinny renders untrusted third-party HTML (room messages), so this CSP is the
# compensating control if the sanitiser is ever bypassed.
#
# Why each source is present:
#   script-src   'self'               only bundled, same-origin scripts;
#                                     index.html has no inline script.
#                'wasm-unsafe-eval'   matrix-sdk-crypto-wasm (E2EE) and
#                                     Element Call instantiate WebAssembly.
#                'sha256-...' x2      the two inline scripts inside the
#                                     vendored Element Call iframe document
#                                     (public/element-call/index.html).
#                google/gstatic       react-google-recaptcha loads
#                                     recaptcha/api.js during registration.
#                js.hcaptcha.com      some homeservers run hCaptcha behind
#                newassets.hcaptcha.com the m.login.recaptcha stage; its
#                                     widget is loaded on demand.
#   connect-src  https: wss:          arbitrary user-chosen homeservers.
#   img/media    https: blob: data:   homeserver media + decrypted blobs.
#   style-src    'unsafe-inline'      React/vanilla-extract inline styles.
#   worker-src   blob:                pdf.js and LiveKit E2EE workers.
#   frame-src    https:               URL-preview embeds + reCAPTCHA frame.
#
# Regenerate the Element Call hashes after bumping
# @element-hq/element-call-embedded — see the snippet in docker-nginx.conf.
# ---------------------------------------------------------------------------
[[headers]]
  for = "/*"

  [headers.values]
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' 'wasm-unsafe-eval' 'sha256-pQY0fuQAnnVQH5nQfjo80rzGkQzeN3JeAtAJ+1KcD4k=' 'sha256-3042zLa3JXvrJe/2n8P/XpIKwqBdNTu7fwbLZUNrzZQ=' https://www.google.com/recaptcha/ https://www.gstatic.com/recaptcha/ https://recaptcha.net/recaptcha/ https://js.hcaptcha.com/ https://newassets.hcaptcha.com/; style-src 'self' 'unsafe-inline'; img-src 'self' https: blob: data:; media-src 'self' https: blob: data:; font-src 'self' data:; connect-src 'self' https: wss: blob: data:; worker-src 'self' blob:; child-src 'self' blob:; frame-src 'self' https:; manifest-src 'self'"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    Permissions-Policy = "accelerometer=(), browsing-topics=(), geolocation=(), gyroscope=(), hid=(), idle-detection=(), local-fonts=(), magnetometer=(), midi=(), payment=(), serial=(), usb=(), xr-spatial-tracking=()"
    # Netlify serves every site over TLS, so HSTS is safe here.
    Strict-Transport-Security = "max-age=63072000; includeSubDomains"

[[redirects]]
  from = "/config.json"
  to = "/config.json"
  status = 200

[[redirects]]
  from = "/manifest.json"
  to = "/manifest.json"
  status = 200

[[redirects]]
  from = "/sw.js"
  to = "/sw.js"
  status = 200

  
[[redirects]]
  from = "/pdf.worker.min.js"
  to = "/pdf.worker.min.js"
  status = 200

[[redirects]]
  from = "/public/*"
  to = "/public/:splat"
  status = 200

[[redirects]]
  from = "/assets/*"
  to = "/assets/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = true