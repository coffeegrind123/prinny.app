name: Refresh public server list

# Rebuilds https://prinny.app/api/servers.json from the three upstream lists.
#
# This has to run in CI rather than in the client because none of the three
# upstreams send an Access-Control-Allow-Origin header, so a browser cannot
# fetch them directly. GitHub Pages does send `*`, which is what makes the
# generated file usable from the web build, the Tauri desktop build and Android
# alike.

on:
  schedule:
    # 04:17 UTC daily. Off the hour on purpose — every upstream gets hammered
    # by everyone else's on-the-hour crons.
    - cron: '17 4 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/build-servers.mjs'
      - '.github/workflows/refresh-servers.yml'

concurrency:
  group: refresh-servers
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # privacydev.net drops TCP from GitHub's egress addresses (measured: every
      # attempt of every run timing out at 10.5s for 21 days, while the same
      # request from a non-cloud IP returns 200 in 0.7s). The script retries
      # through this proxy when a direct connection cannot be had. Same secret
      # the tennisnews scraper uses; without it every fetch is simply direct.
      - name: Mask proxy components
        if: env.UPSTREAM_PROXY != ''
        run: |
          echo "::add-mask::$(echo "$UPSTREAM_PROXY" | sed -n 's|.*@\(.*\):.*|\1|p')"
          echo "::add-mask::$(echo "$UPSTREAM_PROXY" | sed -n 's|.*:\([0-9]*\)$|\1|p')"
          echo "::add-mask::$(echo "$UPSTREAM_PROXY" | sed -n 's|.*://\(.*\):.*@.*|\1|p')"
          echo "::add-mask::$(echo "$UPSTREAM_PROXY" | sed -n 's|.*://.*:\(.*\)@.*|\1|p')"
        env:
          UPSTREAM_PROXY: ${{ secrets.UPSTREAM_PROXY }}

      # No npm dependencies — the script uses only the Node standard library,
      # plus curl (preinstalled on every runner) for the proxy route, which
      # Node 22's fetch cannot do on its own.
      - name: Build merged server list
        run: node scripts/build-servers.mjs
        env:
          PRINNY_HTTP_PROXY: ${{ secrets.UPSTREAM_PROXY }}

      - name: Validate output before publishing
        run: node scripts/validate-servers.mjs

      - name: Commit if changed
        run: |
          set -euo pipefail
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add api/servers.json .server-cache
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          COUNT=$(node -p "require('./api/servers.json').counts.total")
          git commit -m "Refresh server list — ${COUNT} servers [skip ci]"
          git push

      # Deliberately AFTER the push: a source that has served nothing but cache
      # for days is a real problem, but the fresh data from the sources that DO
      # work should still ship. Publishing first and going red second is what
      # gives us both. Before this existed, privacydev aged 21 days across 21
      # consecutive green runs with nobody any the wiser.
      - name: Freshness gate
        run: node scripts/validate-servers.mjs --freshness-gate
